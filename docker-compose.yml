services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: protofico-portfolio
    image: protofico-portfolio:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      - NODE_ENV=production
